name: Minha primeira pipeline

on:
  push:
    branches:
      - main
    paths:
      - "aula02-ativdevops/**"

jobs:
  executar-java:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compilar
        working-directory: aula02-ativdevops
        run: javac Main.java

      - name: Executar
        working-directory: aula02-ativdevops
        run: java Main
